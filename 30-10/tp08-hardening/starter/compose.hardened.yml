# Surcharge durcie de la stack du TP04 :
# docker compose -f ../../../29-10/tp04-compose-entreprise/starter/compose.yml -f compose.hardened.yml up -d --wait

x-hardening: &hardening
  # rootfs en lecture seule : un attaquant ne peut pas déposer de binaire ni modifier l'image
  read_only: true
  # aucune capability Linux par défaut : pas de raw socket, chown, mount, kill d'autres uid...
  cap_drop: [ALL]
  security_opt:
    # un binaire setuid ne peut plus élever les privilèges
    - no-new-privileges:true

services:
  proxy:
    <<: *hardening
    # utilisateur nobody : une faille Traefik ne donne pas root dans le conteneur
    user: "65534:65534"
    # plus de socket Docker montée : elle donnait l'équivalent de root sur l'hôte
    volumes: !reset []
    command:
      - --providers.docker=true
      # Traefik lit l'API Docker via le proxy de socket, en lecture seule
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shop_front
      # port 8000 dans le conteneur : un utilisateur non-root n'a pas besoin de NET_BIND_SERVICE
      - --entrypoints.web.address=:8000
      - --ping=true
      - --accesslog=true
    ports: !override
      - "80:8000"
    networks:
      - front
      - socket
    depends_on:
      socket-proxy:
        condition: service_started
    # pids : limite le nombre de processus (protège contre une fork bomb), memory/cpus : un service ne peut pas
    # affamer les autres ni la machine
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M, pids: 100 }

  # seul conteneur qui voit la socket : il ne laisse passer que des GET sur containers, networks, events, version
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # réseau internal : seul Traefik peut joindre le proxy, pas d'accès extérieur
    networks:
      - socket
    # pas de read_only : l'entrypoint génère haproxy.cfg dans /usr/local/etc/haproxy au démarrage
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M, pids: 100 }

  api:
    <<: *hardening
    # /tmp en mémoire, seul endroit inscriptible
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M, pids: 100 }

  worker:
    <<: *hardening
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M, pids: 100 }

  db:
    <<: *hardening
    # lancé directement en postgres (uid 70) : l'entrypoint n'a plus besoin de chown ni de changer d'utilisateur,
    # donc aucune capability à rajouter
    user: "70:70"
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 100 }

  redis:
    <<: *hardening
    # utilisateur redis (uid 999) au lieu de root
    user: "999:1000"
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M, pids: 100 }

networks:
  socket:
    internal: true
