name: shop-registry

services:
  registry:
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./config.yml:/etc/docker/registry/config.yml:ro
      - ./certs:/certs:ro
      - ./auth:/auth:ro
      - registry-data:/var/lib/registry
    networks:
      default:
        aliases:
          - registry.local
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:5000/"]
      interval: 10s
      timeout: 3s
      retries: 3

  ui:
    image: joxit/docker-registry-ui:2.5.7
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      REGISTRY_TITLE: Shop SAS registry
      NGINX_PROXY_PASS_URL: https://registry.local:5000
      SINGLE_REGISTRY: "true"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    depends_on:
      registry:
        condition: service_healthy

  mirror:
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./mirror-config.yml:/etc/docker/registry/config.yml:ro
      - mirror-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  registry-data:
  mirror-data:
