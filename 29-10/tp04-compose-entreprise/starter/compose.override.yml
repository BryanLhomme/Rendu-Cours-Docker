# Surcharge dev, appliquée automatiquement par docker compose up
services:
  proxy:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shop_front
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
      - --api.insecure=true
      - --log.level=DEBUG
    ports:
      - "8080:8080"

  api:
    command: ["node", "--watch", "src/server.js"]
    environment:
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    # bind mount + node --watch ne marche pas sur Docker Desktop Windows (pas d'événements inotify),
    # compose watch copie le fichier modifié dans le conteneur et node --watch redémarre
    develop:
      watch:
        - action: sync
          path: ./apps/shopapi/src
          target: /app/src
        - action: rebuild
          path: ./apps/shopapi/package.json

  worker:
    environment:
      LOG_LEVEL: DEBUG

  db:
    ports:
      - "5432:5432"
    networks:
      - back
      - dev

networks:
  # back est internal : un conteneur seulement sur back ne peut pas publier de port
  dev:
