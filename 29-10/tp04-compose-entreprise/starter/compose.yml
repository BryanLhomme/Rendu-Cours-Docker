name: shop

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 10s

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging

# DATABASE_URL construite au démarrage à partir du secret, sans toucher au code
x-db-url-entrypoint: &db-url-entrypoint
  - /bin/sh
  - -c
  - export DATABASE_URL="postgres://shop:$$(cat /run/secrets/db_password)@db:5432/shop"; exec "$$@"
  - app

services:
  proxy:
    <<: *service-defaults
    image: traefik:v3.6.25
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shop_front
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - front
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]

  api:
    <<: *service-defaults
    build:
      context: ./apps/shopapi
      args:
        APP_VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
    image: shop/shopapi:${VERSION:-dev}
    entrypoint: *db-url-entrypoint
    command: ["node", "src/server.js"]
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - db_password
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/ready"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.localhost`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.healthcheck.path: /ready
      traefik.http.services.api.loadbalancer.healthcheck.interval: 5s

  worker:
    <<: *service-defaults
    build:
      context: ./apps/shop-worker
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
      secrets:
        - pipconf
    image: shop/shop-worker:${VERSION:-dev}
    entrypoint: *db-url-entrypoint
    command: ["python", "-m", "worker.main"]
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
    secrets:
      - db_password
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]

  db:
    <<: *service-defaults
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]

  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  adminer:
    <<: *service-defaults
    image: adminer:4.8.1
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080') === false ? 1 : 0);"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.adminer.rule: Host(`adminer.localhost`)
      traefik.http.routers.adminer.entrypoints: web
      traefik.http.services.adminer.loadbalancer.server.port: "8080"

  migrate:
    image: postgres:16.4-alpine
    profiles: ["ops"]
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - PGPASSWORD="$$(cat /run/secrets/db_password)" psql -h db -U shop -d shop -v ON_ERROR_STOP=1 -f "/migrations/$${MIGRATION:?MIGRATION obligatoire}"
    environment:
      MIGRATION: ${MIGRATION:-}
    secrets:
      - db_password
    volumes:
      - ./db/migrations:/migrations:ro
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy

networks:
  front:
  back:
    internal: true

volumes:
  pgdata:
  redisdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pipconf:
    file: ./apps/shop-worker/pip.conf
